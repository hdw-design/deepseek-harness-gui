<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>欢迎使用 DeepSeek Harness</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d1117; color: #c9d1d9;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .card {
      max-width: 560px; padding: 32px 36px; background: #161b22;
      border: 1px solid #30363d; border-radius: 12px;
    }
    h1 { font-size: 22px; margin: 0 0 16px; }
    ol { color: #8b949e; font-size: 14px; line-height: 2; padding-left: 20px; }
    ol b { color: #c9d1d9; }
    code {
      background: #0d1117; border: 1px solid #30363d; border-radius: 4px;
      padding: 1px 6px; font-size: 13px; color: #79c0ff;
    }
    button {
      margin-top: 20px; padding: 10px 28px; font-size: 15px; cursor: pointer;
      color: #fff; background: #1f6feb; border: none; border-radius: 6px;
    }
    button:hover { background: #388bfd; }
    .tip { margin-top: 16px; font-size: 12px; color: #6e7681; }
  </style>
</head>
<body>
  <div class="card">
    <h1>欢迎使用 DeepSeek Harness</h1>
    <ol>
      <li>进入界面后，打开 <b>Settings → Models</b></li>
      <li>填入你的 <b>DeepSeek API Key</b>（<code>sk-...</code>）并保存，立即生效，无需重启</li>
      <li>点击 <b>Choose workspace</b> 选择项目目录，即可开始会话</li>
    </ol>
    <button id="go">开始使用</button>
    <p class="tip">API Key 可在 <b>platform.deepseek.com</b> 申请。数据保存在本机 <code>~/.dsh</code> 目录。</p>
  </div>
  <script>
    const url = new URLSearchParams(location.search).get('url') || 'http://127.0.0.1:3080';
    document.getElementById('go').addEventListener('click', () => { location.href = url; });
  </script>
</body>
</html>
