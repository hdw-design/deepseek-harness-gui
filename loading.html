<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DeepSeek Harness</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d1117; color: #c9d1d9;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .spinner {
      width: 42px; height: 42px; border: 4px solid #30363d;
      border-top-color: #58a6ff; border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
    p { color: #8b949e; font-size: 13px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>DeepSeek Harness 正在启动</h1>
  <p>正在拉起本地 dsh 服务（127.0.0.1:3080），请稍候…</p>
</body>
</html>
